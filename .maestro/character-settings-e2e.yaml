appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - character-settings
name: Character rename and settings end to end
---
# Exercises rename from the character management screen and the character
# settings screen: renames the active character, edits max encumbrance,
# turns weight tracking off, saves, and confirms the encumbrance card
# disappears from the inventory summary strip.
# An empty database auto-seeds "Sample Character", so the flow starts there.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- assertVisible: ".*Sample Character.*"

- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible: "Rename or delete"
    timeout: 30000
- tapOn:
    id: manage-characters-row
- extendedWaitUntil:
    visible:
      id: rename-character-button
    timeout: 30000

- tapOn:
    id: rename-character-button
- extendedWaitUntil:
    visible:
      id: character-rename-input
    timeout: 30000
- tapOn:
    id: character-rename-input
- eraseText
- inputText: "QA Renamed"
- tapOn:
    id: character-rename-save

- extendedWaitUntil:
    visible: ".*QA Renamed.*"
    timeout: 30000
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible: "Encumbrance & weight"
    timeout: 30000
- tapOn:
    id: settings-encumbrance-row

- extendedWaitUntil:
    visible: "Max Encumbrance"
    timeout: 30000
- tapOn:
    id: character-max-encumbrance-input
- eraseText
- inputText: "150"
- tapOn:
    id: character-weight-tracking-toggle
- tapOn:
    id: character-settings-save

- extendedWaitUntil:
    visible: "Encumbrance & weight"
    timeout: 30000
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: encumbrance-card
    timeout: 30000
