appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - create-storage
name: Create a storage container end to end
---
# Full journey: an empty database auto-seeds Sample Character, so switch to a
# fresh character, open the storage form, fill every field, submit, and see the
# container card on the inventory.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000
- tapOn:
    id: add-container-button

# Fill the form — this is where inputs were reported blocked under the header
- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: storage-description-input
- inputText: "Extra dimensional space"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: create-storage-button

# Back on the inventory: the new container card should be visible
- assertVisible: ".*Bag of Holding.*"
