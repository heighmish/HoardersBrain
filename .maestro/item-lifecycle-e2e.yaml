appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - item-lifecycle
name: Item lifecycle end to end
---
# Full journey: an empty database auto-seeds Sample Character, so switch to a
# fresh character, create a container and a stacked item; open the item detail;
# edit the item; decrement the stack; remove the rest.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000
- tapOn:
    id: add-container-button

- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: create-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    id: fab-add-item

- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Rope of Climbing"
- tapOn:
    id: item-quantity-input
- eraseText
- inputText: "3"
- tapOn:
    id: create-item-button

- assertVisible: "Rope of Climbing"
- assertVisible: "3"

- tapOn:
    text: "Rope of Climbing"
- extendedWaitUntil:
    visible:
      id: item-detail-screen
    timeout: 30000
- assertVisible: "Quantity"
- assertVisible: "Bag of Holding"
- assertVisible: "Edit Item"

- tapOn:
    id: edit-item-button
- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn:
    id: item-name-input
- eraseText
- inputText: "Rope of Climbing II"
- tapOn:
    id: save-item-button
- extendedWaitUntil:
    visible: "Rope of Climbing II"
    timeout: 30000

- tapOn:
    id: remove-one-button
- extendedWaitUntil:
    visible: "2"
    timeout: 30000
- assertVisible: "Remove All"

- tapOn:
    id: remove-all-button
- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Rope of Climbing II"
    timeout: 30000
