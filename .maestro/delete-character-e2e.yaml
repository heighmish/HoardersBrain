appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - delete-character
name: Delete character end to end
---
# Renames the auto-seeded Sample Character to QA Alpha, creates QA Beta,
# deletes the active (QA Beta) character, and confirms the app lands on the
# remaining character with the deleted one gone from the switcher.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- assertVisible: ".*Sample Character.*"

# Rename the seeded character so the remaining-character assertion is explicit.
- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible: "Rename or delete"
    timeout: 30000
- tapOn:
    id: manage-characters-row
- extendedWaitUntil:
    visible:
      id: rename-character-button
    timeout: 30000
- tapOn:
    id: rename-character-button
- extendedWaitUntil:
    visible:
      id: character-rename-input
    timeout: 30000
- tapOn:
    id: character-rename-input
- eraseText
- inputText: "QA Alpha"
- tapOn:
    id: character-rename-save
- extendedWaitUntil:
    visible: ".*QA Alpha.*"
    timeout: 30000
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible: "Rename or delete"
    timeout: 30000
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"

- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Beta"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Beta.*"
    timeout: 30000

# Deleting lives on the character management screen.
- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible: "Rename or delete"
    timeout: 30000
- tapOn:
    id: manage-characters-row
- extendedWaitUntil:
    visible:
      id: delete-character-button
    timeout: 30000
- tapOn:
    id: delete-character-button
- extendedWaitUntil:
    visible:
      id: character-delete-confirm
    timeout: 30000
- tapOn:
    id: character-delete-confirm

- extendedWaitUntil:
    visible: "Rename or delete"
    timeout: 30000
- tapOn:
    id: back-button

- extendedWaitUntil:
    visible: ".*QA Alpha.*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: ".*QA Beta.*"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible:
      id: create-new-character-button
    timeout: 30000
- extendedWaitUntil:
    notVisible: ".*QA Beta.*"
    timeout: 30000
- assertVisible: ".*QA Alpha.*"
