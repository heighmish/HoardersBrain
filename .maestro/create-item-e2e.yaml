appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - create-item
name: Create an item end to end
---
# Full journey: an empty database auto-seeds Sample Character, so switch to a
# fresh character, create a storage container, create an item inside it, and
# see the item row rendered on the inventory.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000
- tapOn:
    id: add-container-button

- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: create-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    id: fab-add-item

- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Rope of Climbing"
- tapOn:
    id: item-description-input
- inputText: "50 feet of hemp"
- tapOn:
    id: item-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: item-weight-input
- eraseText
- inputText: "1.5"
- tapOn:
    id: create-item-button

- assertVisible: "Rope of Climbing"
- assertVisible: "1.5"
