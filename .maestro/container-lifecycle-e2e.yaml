appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - container-lifecycle
name: Create, edit, and delete a container end to end
---
# Golden path: create a character and a container, add an item to the
# container, rename the container, then delete it and confirm the
# container is gone (soft-deleted: the item is hidden with it).
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 60000
- tapOn:
    text: "Character Name"
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*Currency.*"
    timeout: 30000
- tapOn: "Add Container"

- extendedWaitUntil:
    visible: "Description"
    timeout: 30000
- tapOn:
    text: "Name"
- inputText: "Bag of Holding"
- tapOn: "Uncommon"
- tapOn: "Create"

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    text: "AddItem"
    rightOf:
      text: ".*Bag of Holding.*"

- extendedWaitUntil:
    visible: "Weight?"
    timeout: 30000
- tapOn:
    text: "Name"
- inputText: "Rope of Climbing"
- tapOn: "Create"

- extendedWaitUntil:
    visible: "Rope of Climbing"
    timeout: 30000

- tapOn:
    text: "Edit"
    below:
      text: ".*Bag of Holding.*"
- extendedWaitUntil:
    visible: "Does the storage have a fixed weight?"
    timeout: 30000
- tapOn:
    id: storage-name-input
- eraseText
- inputText: "Bag of Holding Two"
- tapOn:
    id: save-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding Two.*"
    timeout: 30000

- tapOn:
    text: "Delete"
    below:
      text: ".*Bag of Holding Two.*"
- extendedWaitUntil:
    visible: "Delete container?"
    timeout: 30000
- tapOn:
    text: "Delete"
    rightOf:
      text: "Delete container?"

- extendedWaitUntil:
    notVisible: ".*Bag of Holding Two.*"
    timeout: 30000
- assertNotVisible: ".*Bag of Holding.*"
- assertNotVisible: "Rope of Climbing"
