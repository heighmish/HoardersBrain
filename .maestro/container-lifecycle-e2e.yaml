appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - container-lifecycle
name: Create, edit, and delete a container end to end
---
# Golden path: create a character and a container, add an item to the
# container, rename the container, then delete it and confirm the
# container is gone (soft-deleted: the item is hidden with it).
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 60000
- tapOn:
    text: "Character Name"
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*Currency.*"
    timeout: 30000
- tapOn: "Add Container"

- extendedWaitUntil:
    visible: "Description"
    timeout: 30000
- tapOn:
    text: "Name"
- inputText: "Bag of Holding"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn: "Create"

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    id: fab-add-item
- extendedWaitUntil:
    visible: "Weight?"
    timeout: 30000
- tapOn:
    text: "Bag of Holding"
- tapOn:
    text: "Name"
- inputText: "Rope of Climbing"
- tapOn: "Create"

- extendedWaitUntil:
    visible: "Rope of Climbing"
    timeout: 30000

- tapOn:
    id: container-menu-2
- extendedWaitUntil:
    visible: "Edit"
    timeout: 30000
- tapOn:
    id: container-edit-action-2
- extendedWaitUntil:
    visible: "Fixed weight"
    timeout: 30000
- tapOn:
    id: storage-name-input
- eraseText
- inputText: "Bag of Holding Two"
- tapOn:
    id: save-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding Two.*"
    timeout: 30000

- tapOn:
    id: container-menu-2
- extendedWaitUntil:
    visible: "Delete"
    timeout: 30000
- tapOn:
    id: container-delete-action-2
- extendedWaitUntil:
    visible: "Delete container?"
    timeout: 30000
- tapOn:
    id: delete-confirm-input
- inputText: "Bag of Holding Two"
- tapOn:
    id: delete-confirm-button

- extendedWaitUntil:
    notVisible: ".*Bag of Holding Two.*"
    timeout: 30000
- assertNotVisible: ".*Bag of Holding.*"
- assertNotVisible: "Rope of Climbing"
