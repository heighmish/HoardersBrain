appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - container-lifecycle
name: Create, edit, and delete a container end to end
---
# Golden path: an empty database auto-seeds Sample Character, so switch to a
# fresh character, add a container, add an item to it, rename the container,
# then delete it and confirm the container is gone (soft-deleted: the item is
# hidden with it).
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000
- tapOn:
    id: add-container-button

- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: create-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    id: fab-add-item
- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Rope of Climbing"
- tapOn:
    id: create-item-button

- extendedWaitUntil:
    visible: "Rope of Climbing"
    timeout: 30000

# QA Hero's default container is id 5, so the new container is id 6.
- tapOn:
    id: container-menu-6
- extendedWaitUntil:
    visible: "Edit"
    timeout: 30000
- tapOn:
    id: container-edit-action-6
- extendedWaitUntil:
    visible: "Fixed weight"
    timeout: 30000
- tapOn:
    id: storage-name-input
- eraseText
- inputText: "Bag of Holding Two"
- tapOn:
    id: save-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding Two.*"
    timeout: 30000

- tapOn:
    id: container-menu-6
- extendedWaitUntil:
    visible: "Delete"
    timeout: 30000
- tapOn:
    id: container-delete-action-6
- extendedWaitUntil:
    visible: "Delete container?"
    timeout: 30000
- tapOn:
    id: delete-confirm-input
- inputText: "Bag of Holding Two"
- tapOn:
    id: delete-confirm-button

- extendedWaitUntil:
    notVisible: ".*Bag of Holding Two.*"
    timeout: 30000
- assertNotVisible: "Rope of Climbing"
