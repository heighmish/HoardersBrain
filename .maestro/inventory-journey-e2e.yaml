appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - inventory-journey
name: Inventory, containers, items, and transfer end to end
---
# End-to-end inventory journey:
# 1. Cold boot auto-seeds Sample Character; create a fresh character (QA Hero).
# 2. Create a container (Bag of Holding, Uncommon), add a stacked item, edit it,
#    decrement quantity, and remove all.
# 3. Add another item, create a second character (QA Second), transfer the item
#    to QA Second, and verify it appears under QA Second's Equipped container.
# 4. Switch back to QA Hero, rename the container, and delete it.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000

# Create container
- tapOn:
    id: add-container-button
- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: storage-rarity-row
- tapOn: "Uncommon"
- tapOn:
    id: create-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000

# Create stacked item, edit, decrement, remove all
- tapOn:
    id: fab-add-item
- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Rope of Climbing"
- tapOn:
    id: numeric-increment
    index: 0
- tapOn:
    id: numeric-increment
    index: 0
- tapOn:
    id: numeric-increment
    index: 1
- scroll
- tapOn:
    id: create-item-button

- extendedWaitUntil:
    visible:
      id: fab-add-item
    timeout: 30000
- assertVisible: "Rope of Climbing"

- tapOn:
    text: "Rope of Climbing"
- extendedWaitUntil:
    visible:
      id: item-detail-screen
    timeout: 30000
- assertVisible: "Quantity"
- assertVisible: "Bag of Holding"

- tapOn:
    id: edit-item-button
- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn:
    id: item-name-input
- eraseText
- inputText: "Rope of Climbing II"
- scroll
- tapOn:
    id: save-item-button
- extendedWaitUntil:
    visible: "Rope of Climbing II"
    timeout: 30000

- tapOn:
    id: remove-one-button
- extendedWaitUntil:
    visible: "2"
    timeout: 30000
- tapOn:
    id: remove-all-button
- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Rope of Climbing II"
    timeout: 30000

# Create item for transfer + create second character + transfer
- tapOn:
    id: fab-add-item
- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Healing Potion"
- scroll
- tapOn:
    id: create-item-button
- extendedWaitUntil:
    visible:
      id: fab-add-item
    timeout: 30000
- assertVisible: "Healing Potion"

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Second"
- tapOn: "Create Character"
- extendedWaitUntil:
    visible: ".*QA Second.*"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "QA Hero"
    timeout: 30000
- tapOn: "QA Hero"
- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000

- tapOn:
    text: "Healing Potion"
- extendedWaitUntil:
    visible:
      id: item-detail-screen
    timeout: 30000
- tapOn:
    id: transfer-item-button
- extendedWaitUntil:
    visible:
      id: transfer-picker-screen
    timeout: 30000
- tapOn: "QA Second"
- extendedWaitUntil:
    notVisible: "Healing Potion"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "QA Second"
    timeout: 30000
- tapOn: "QA Second"
- extendedWaitUntil:
    visible: ".*Equipped.*"
    timeout: 30000
- assertVisible: "Healing Potion"

# Switch back to QA Hero, rename container, and delete it
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "QA Hero"
    timeout: 30000
- tapOn: "QA Hero"
- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000

# QA Hero's default container is id 5, so Bag of Holding is id 6.
- tapOn:
    id: container-menu-6
- extendedWaitUntil:
    visible: "Edit"
    timeout: 30000
- tapOn:
    id: container-edit-action-6
- extendedWaitUntil:
    visible: "Fixed weight"
    timeout: 30000
- tapOn:
    id: storage-name-input
- eraseText
- inputText: "Bag of Holding Two"
- scroll
- tapOn:
    id: save-storage-button
- extendedWaitUntil:
    visible: ".*Bag of Holding Two.*"
    timeout: 30000

- tapOn:
    id: container-menu-6
- extendedWaitUntil:
    visible: "Delete"
    timeout: 30000
- tapOn:
    id: container-delete-action-6
- extendedWaitUntil:
    visible: "Delete container?"
    timeout: 30000
- tapOn:
    id: delete-confirm-input
- inputText: "Bag of Holding Two"
- scroll
- tapOn:
    id: delete-confirm-button
- extendedWaitUntil:
    notVisible: ".*Bag of Holding Two.*"
    timeout: 30000
