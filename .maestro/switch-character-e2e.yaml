appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - switch-character
name: Switch characters end to end
---
# Exercises the character sheet: start on the auto-seeded Sample Character,
# open the switcher sheet, create a second character, then switch back to the
# seeded one through its row.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- assertVisible: ".*Sample Character.*"

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"

- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Second"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Second.*"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible:
      id: character-row-1
    timeout: 30000
- tapOn:
    id: character-row-1
- extendedWaitUntil:
    visible: ".*Sample Character.*"
    timeout: 30000
