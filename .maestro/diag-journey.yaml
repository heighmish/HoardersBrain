appId: com.heighmish.HoardersBrain
tags:
  - diag
name: Dev client entry to CreateStorageForm
---
# Enters through the dev client launcher (saved Metro server), then walks to the
# CreateStorageForm. An empty database auto-seeds Sample Character, so no
# character creation step is needed. No launchApp: the dev client's saved server
# config must not be wiped between steps.
# The launcher row is labelled with whatever Metro URL the dev client saved;
# pass it at run time, e.g.
#   maestro test .maestro/diag-journey.yaml -e METRO_SERVER=localhost:8081
- tapOn:
    text: "${METRO_SERVER}"
- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- scrollUntilVisible:
    element:
      id: add-container-button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: add-container-button
- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
