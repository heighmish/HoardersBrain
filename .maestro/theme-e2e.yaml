appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - theme
name: Switch theme preset and mode
---
# Journey: an empty database auto-seeds Sample Character, so the inventory is
# ready immediately; open the theme screen from settings, switch to the Dracula
# preset, then switch the mode to Dark. The screen's state line
# ("PresetName · Mode") asserts each change with text-only assertions; taps go
# through stable testIDs.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible: "Theme"
    timeout: 30000
- tapOn:
    id: settings-theme-row

- extendedWaitUntil:
    visible: "Mind Flayer · System"
    timeout: 30000
- tapOn:
    id: theme-preset-dracula
- assertVisible: "Dracula · System"
- tapOn:
    id: theme-mode-dark
- assertVisible: "Dracula · Dark"
