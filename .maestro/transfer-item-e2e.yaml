appId: com.heighmish.HoardersBrain
tags:
  - e2e
  - transfer-item
name: Transfer an item between characters end to end
---
# An empty database auto-seeds Sample Character, so switch to a fresh character,
# create a container and an item in-flow, then create a second character and
# transfer the full stack to its auto-created Equipped container; verifies the
# item is gone from the source and visible on the target.
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 60000
- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"
- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Hero"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Hero.*"
    timeout: 30000
- tapOn:
    id: add-container-button

- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 30000
- tapOn:
    id: storage-name-input
- inputText: "Bag of Holding"
- tapOn:
    id: create-storage-button

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    id: fab-add-item

- extendedWaitUntil:
    visible:
      id: item-name-input
    timeout: 30000
- tapOn: "Bag of Holding"
- tapOn:
    id: item-name-input
- inputText: "Healing Potion"
- tapOn:
    id: create-item-button

- assertVisible: "Healing Potion"

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "Create new character"
    timeout: 30000
- tapOn: "Create new character"

- extendedWaitUntil:
    visible: "Please create a character"
    timeout: 30000
- tapOn:
    id: character-name-input
- inputText: "QA Second"
- tapOn: "Create Character"

- extendedWaitUntil:
    visible: ".*QA Second.*"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "QA Hero"
    timeout: 30000
- tapOn: "QA Hero"

- extendedWaitUntil:
    visible: ".*Bag of Holding.*"
    timeout: 30000
- tapOn:
    text: "Healing Potion"
- extendedWaitUntil:
    visible:
      id: item-detail-screen
    timeout: 30000
- tapOn:
    id: transfer-item-button
- extendedWaitUntil:
    visible:
      id: transfer-picker-screen
    timeout: 30000
- tapOn: "QA Second"

- extendedWaitUntil:
    notVisible: "Healing Potion"
    timeout: 30000

- tapOn:
    id: character-switcher
- extendedWaitUntil:
    visible: "QA Second"
    timeout: 30000
- tapOn: "QA Second"

- extendedWaitUntil:
    visible: ".*Equipped.*"
    timeout: 30000
- assertVisible: "Healing Potion"
