appId: com.heighmish.HoardersBrain
tags:
  - diag
  - create-storage
name: Create storage form diagnostic
---
# Cleared-database journey: an empty database auto-seeds Sample Character, so
# launch lands on the inventory; exercises the summary strip and the
# CreateStorageForm (the reported-broken screen).
- launchApp:
    appId: com.heighmish.HoardersBrain
    clearState: true

# Inventory (tabs) screen, seeded on first launch
- extendedWaitUntil:
    visible:
      id: currency-card
    timeout: 30000
- assertVisible:
    id: encumbrance-card
- scrollUntilVisible:
    element:
      id: add-container-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: add-container-button

# The form under investigation — app remains on this screen after the flow,
# so `maestro hierarchy` can dump it immediately afterwards.
- extendedWaitUntil:
    visible:
      id: storage-name-input
    timeout: 20000
- assertVisible:
    id: storage-description-input
